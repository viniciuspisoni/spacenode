<!--
  Template Supabase Auth → "Reauthentication".
  Cole em: Supabase Dashboard → Authentication → Email Templates → "Reauthentication".
  Variável usada: {{ .Token }} (código de verificação, não é link).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background:#f4f4f5;">
  <tr>
    <td align="center" style="padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border:1px solid #e7e7ea;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#0a0a0a;padding:22px 28px;">
            <span style="color:#ffffff;font-size:20px;font-weight:600;letter-spacing:-0.02em;">spacenode</span>
            <span style="display:inline-block;width:5px;height:5px;border-radius:1px;background:#30b46c;margin-left:3px;vertical-align:baseline;"></span>
          </td>
        </tr>
        <tr>
          <td style="padding:34px 28px 28px;">
            <h1 style="margin:0 0 12px;font-size:21px;font-weight:600;color:#111111;letter-spacing:-0.02em;">Confirme que é você</h1>
            <p style="margin:0 0 22px;font-size:14px;line-height:1.65;color:#52525b;">
              Use o código abaixo para confirmar esta ação na sua conta Spacenode.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 22px;">
              <tr>
                <td style="background:#f4f4f5;border:1px solid #e7e7ea;border-radius:10px;padding:14px 24px;">
                  <span style="font-size:30px;font-weight:700;letter-spacing:7px;color:#111111;font-family:'Courier New',monospace;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
            <p style="margin:0;font-size:12px;line-height:1.65;color:#a1a1aa;">
              O código expira em alguns minutos. Se você não solicitou isso, é só ignorar este email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px;border-top:1px solid #e7e7ea;background:#fafafa;">
            <span style="font-size:11px;color:#a1a1aa;">Spacenode · O hub criativo para arquitetos e designers de interiores</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
