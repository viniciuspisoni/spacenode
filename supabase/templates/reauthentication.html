<!--
  Template Supabase Auth → "Reauthentication".
  Cole em: Supabase Dashboard → Authentication → Email Templates → "Reauthentication".
  Variável usada: {{ .Token }} (código de verificação, não é link).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background:#F7F7F5;">
  <tr>
    <td align="center" style="padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border:1px solid #E8E9E7;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#151618;padding:22px 28px;">
            <img src="https://spacenode.app/brand/spacenode-logo-horizontal.png" width="176" height="32" alt="SpaceNode" style="display:block;width:176px;height:32px;border:0;">
          </td>
        </tr>
        <tr>
          <td style="padding:34px 28px 28px;">
            <h1 style="margin:0 0 12px;font-size:21px;font-weight:500;color:#151618;letter-spacing:-0.02em;">Confirme que é você</h1>
            <p style="margin:0 0 22px;font-size:14px;line-height:1.65;color:#60646B;">
              Use o código abaixo para confirmar esta ação na sua conta SpaceNode.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 22px;">
              <tr>
                <td style="background:#F7F7F5;border:1px solid #E8E9E7;border-radius:10px;padding:14px 24px;">
                  <span style="font-size:30px;font-weight:700;letter-spacing:7px;color:#151618;font-family:'Courier New',monospace;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
            <p style="margin:0;font-size:12px;line-height:1.65;color:#60646B;">
              O código expira em alguns minutos. Se você não solicitou isso, é só ignorar este email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px;border-top:1px solid #E8E9E7;background:#F7F7F5;">
            <span style="font-size:11px;color:#60646B;">SpaceNode · Visualize seus projetos.</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
