<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SPACENODE — Post 1080×1350</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('../../public/fonts/geist-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1c1c1e;
    font-family: 'Geist', -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 64px;
  }

  /* ---------- Cabeçalho da página (fora da arte) ---------- */
  .page-head {
    width: 1080px;
    max-width: 100%;
    margin-bottom: 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .page-head .format {
    color: #f5f5f7;
    font-size: 14px;
    font-weight: 640;
    letter-spacing: 0.02em;
  }
  .page-head .hint {
    color: #6e6e73;
    font-size: 13px;
    font-weight: 400;
  }

  /* ---------- Arte ---------- */
  .canvas {
    width: 1080px;
    height: 1350px;
    background: #0a0a0a;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 120px 96px;
  }

  /* Eyebrow: hairline + ponto verde + label */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 18px;
    flex: none;
  }
  .eyebrow .rule {
    width: 72px;
    height: 1px;
    background: rgba(255, 255, 255, 0.14);
    flex: none;
  }
  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #30d158;
    flex: none;
  }
  .eyebrow .label {
    color: #a1a1a6;
    font-size: 24px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    white-space: nowrap;
  }

  .headline {
    margin-top: 64px;
    color: #f5f5f7;
    font-size: 92px;
    font-weight: 640;
    line-height: 1.06;
    letter-spacing: -0.02em;
    max-width: 860px;
    flex: none;
  }

  .support {
    margin-top: 36px;
    color: #a1a1a6;
    font-size: 34px;
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: -0.005em;
    max-width: 760px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: none;
  }

  /* Slot de imagem — banda inferior, ~45% da arte */
  .image-slot {
    margin-top: 72px;
    flex: 1;
    min-height: 580px;
    border: 1px dashed rgba(255, 255, 255, 0.14);
    border-radius: 4px;
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
  }
  .image-note {
    color: #6e6e73;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.5;
    text-align: center;
    max-width: 620px;
  }

  /* Wordmark — rodapé fixo da arte */
  .wordmark {
    margin-top: 48px;
    color: #a1a1a6;
    font-size: 15px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    flex: none;
  }
</style>
</head>
<body>

  <div class="page-head">
    <span class="format">Post 1080×1350</span>
    <span class="hint">DevTools → clique-direito no nó .canvas → Capture node screenshot</span>
  </div>

  <div class="canvas">
    <div class="eyebrow">
      <span class="rule"></span>
      <span class="dot"></span>
      <span class="label">{{EYEBROW}}</span>
    </div>

    <h1 class="headline">{{HEADLINE}}</h1>

    <p class="support">{{SUPPORT}}</p>

    <div class="image-slot">
      <p class="image-note">{{IMAGE_NOTE}}</p>
    </div>

    <div class="wordmark">SPACENODE</div>
  </div>

</body>
</html>
